<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrainFeed - Daily Feed</title>
    <link rel="icon" type="image/x-icon" href="/asset/imgages/download.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/asset/script/script.js"></script>
    <style>
        :root {
            --bg-dark: #0a111e;
            --bg-glow: #1a2a44;
            --accent: #4285f4;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
        }

        .app-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .top-nav {
            padding: clamp(15px, 4dvh, 30px) 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-group {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .logo-icon {
            filter: drop-shadow(0 0 8px var(--accent));
            display: flex;
            align-items: center;
        }

        .logo-icon img {
            width: 32px;
        }

        .nav-title {
            font-size: 1.2rem;
            font-weight: 700;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2d3748;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .filter-bar {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 20px;
            scrollbar-width: none;
        }

        .filter-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 8px 18px;
            background: var(--glass);
            border-radius: 50px;
            font-size: 0.85rem;
            white-space: nowrap;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip.active {
            border-color: var(--accent);
            background: rgba(66, 133, 244, 0.2);
            color: #fff;
        }

        .main-feed {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 20px 120px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .main-feed::-webkit-scrollbar {
            width: 5px;
        }

        .main-feed::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            min-height: 450px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .difficulty.hard {
            color: #f87171;
        }

        .difficulty.medium {
            color: #fbbf24;
        }

        .difficulty.easy {
            color: #4ade80;
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
        }

        .question {
            font-size: 1.3rem;
            text-align: center;
            line-height: 1.5;
            padding: 0 10px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .opt-btn {
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 18px;
            border: 1px solid transparent;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .opt-btn:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .opt-btn.active {
            border-color: var(--accent);
            background: rgba(66, 133, 244, 0.1);
        }

        .opt-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            border: none;
            background: linear-gradient(90deg, #4285f4, #2b6cb0);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 20px rgba(66, 133, 244, 0.25);
        }

        .submit-btn:disabled {
            cursor: not-allowed;
            background: #2d3748;
            box-shadow: none;
            opacity: 0.8;
        }

        .card-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .view-exp-btn {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .view-exp-btn:hover {
            text-decoration: underline;
        }

        .feedback-msg {
            animation: slideIn 0.3s ease-out;
            font-size: 0.9rem;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .streak-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 138, 0, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 138, 0, 0.3);
            margin-right: 8px;
        }

        .streak-icon {
            width: 16px;
            height: 16px;
            color: #ff8a00;
            filter: drop-shadow(0 0 5px #ff8a00);
        }

        #streak-score {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ff8a00;
        }

        /* Cognitive Load Alert */
        .cognitive-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 200;
            display: none;
            backdrop-filter: blur(10px);
            animation: slideIn 0.3s ease-out;
        }

        /* Loading State */
        .feed-loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mastery tag on card */
        .mastery-tag {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .mastery-tag.advanced {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .mastery-tag.competent {
            background: rgba(66, 133, 244, 0.15);
            color: #4285f4;
        }

        .mastery-tag.developing {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .mastery-tag.at-risk {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        /* SIDEBAR / BOTTOM NAV */
        .side-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 12px 10px 25px;
            background: rgba(10, 17, 30, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s;
            flex: 1;
        }

        .nav-tab.active {
            color: var(--accent);
        }

        .nav-text-mobile {
            font-size: 0.65rem;
            font-weight: 500;
        }

        .nav-text-desktop {
            display: none;
        }

        html {
            font-size: 14px;
        }

        @media (max-width: 480px) {
            html {
                font-size: 13px;
            }

            .top-nav {
                padding: 15px 15px 5px;
            }

            .logo-group span {
                font-size: 0.9rem;
            }

            .card {
                padding: 16px;
                min-height: auto;
            }

            .question {
                font-size: 1.15rem;
                line-height: 1.4;
                margin-bottom: 10px;
            }

            .opt-btn {
                padding: 12px;
                font-size: 0.9rem;
                border-radius: 12px;
            }

            .submit-btn {
                padding: 12px;
                margin-top: 10px;
                font-size: 0.95rem;
            }

            .streak-container {
                padding: 3px 8px;
            }

            .nav-right {
                gap: 10px;
            }
        }

        @media (max-width: 350px) {
            .filter-bar {
                padding: 5px 15px;
            }

            .chip {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .card {
                margin-bottom: 10px;
            }
        }

        @media (min-width: 1024px) {
            body {
                overflow: hidden;
            }

            .app-shell {
                display: grid;
                grid-template-columns: 260px 1fr;
                grid-template-areas: "sidebar main";
            }

            .side-nav {
                grid-area: sidebar;
                position: static;
                flex-direction: column;
                justify-content: flex-start;
                height: 100vh;
                padding: 40px 20px;
                border-top: none;
                border-right: 1px solid var(--border);
                gap: 12px;
                background: transparent;
            }

            .nav-tab {
                flex-direction: row;
                padding: 15px 20px;
                border-radius: 16px;
                gap: 15px;
                flex: none;
                width: 100%;
            }

            .nav-tab:hover {
                background: var(--glass);
            }

            .nav-tab.active {
                background: rgba(66, 133, 244, 0.1);
            }

            .nav-text-mobile {
                display: none;
            }

            .nav-text-desktop {
                display: block;
                font-size: 1rem;
                font-weight: 500;
            }

            .main-content {
                grid-area: main;
            }

            .nav-title {
                display: block;
                position: static;
                transform: none;
            }

            .top-nav {
                padding: 30px 40px;
            }

            .filter-bar {
                padding: 10px 40px 25px;
            }

            .main-feed {
                padding: 0 40px 40px;
                height: calc(100vh - 180px);
            }

            .feed-grid {
                grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
                gap: 30px;
            }

            .card:hover {
                transform: translateY(-5px);
                border-color: rgba(255, 255, 255, 0.2);
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .app-shell {
                display: grid;
                grid-template-columns: 80px 1fr;
            }

            .side-nav {
                position: static;
                flex-direction: column;
                height: 100vh;
                border-top: none;
                border-right: 1px solid var(--border);
                padding: 30px 0;
                gap: 30px;
            }

            .nav-text-mobile,
            .nav-text-desktop {
                display: none;
            }

            .feed-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-title {
                display: block;
                position: static;
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <nav class="side-nav">
            <a href="./MainFeedPG.html" class="nav-tab active">
                <i data-lucide="home"></i>
                <span class="nav-text-mobile">Home</span>
                <span class="nav-text-desktop">Home Feed</span>
            </a>
            <a href="./PostPG.html" class="nav-tab">
                <i data-lucide="square-plus"></i>
                <span class="nav-text-mobile">Post</span>
                <span class="nav-text-desktop">New Post</span>
            </a>
            <a href="./AnalticsPG.html" class="nav-tab">
                <i data-lucide="bar-chart-3"></i>
                <span class="nav-text-mobile">Analytics</span>
                <span class="nav-text-desktop">Analytics</span>
            </a>
            <a href="./notificationPG.html" class="nav-tab">
                <i data-lucide="bell"></i>
                <span class="nav-text-mobile">Alerts</span>
                <span class="nav-text-desktop">Notifications</span>
            </a>
            <a href="./ProfilePG.html" class="nav-tab">
                <i data-lucide="user"></i>
                <span class="nav-text-mobile">Profile</span>
                <span class="nav-text-desktop">Profile</span>
            </a>
        </nav>

        <div class="main-content">
            <header class="top-nav">
                <div class="logo-group">
                    <div class="logo-icon">
                        <img src="/asset/imgages/IMG_20260215_190534-removebg-preview.png" alt="">
                    </div>
                    <span>BrainFeed</span>
                </div>
                <h1 class="nav-title">Daily Feed</h1>
                <div class="nav-right">
                    <div class="streak-container">
                        <i data-lucide="flame" class="streak-icon"></i>
                        <span id="streak-score" data-dynamic="true">0</span>
                    </div>
                    <a href="./notificationPG.html" style="color: white;"> <i data-lucide="bell"
                            style="cursor:pointer"></i></a>
                    <div class="user-avatar" id="user-avatar" onclick="location.href='./ProfilePG.html'"
                        style="display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.7rem;color:#fff;">
                    </div>
                </div>
            </header>

            <div class="filter-bar" id="filter-bar">
                <div class="chip active" data-category="All">All</div>
                <div class="chip" data-category="Aptitude">Aptitude</div>
                <div class="chip" data-category="Maths">Maths</div>
                <div class="chip" data-category="Reasoning">Reasoning</div>
                <div class="chip" data-category="Coding">Coding</div>
                <div class="chip" data-category="Core Subjects">Core Subjects</div>
                <div class="chip" data-category="Verbal">Verbal</div>
            </div>

            <!-- Cognitive Load Alert -->
            <div class="cognitive-alert" id="cognitive-alert"></div>

            <main class="main-feed">
                <div class="feed-grid" id="feed-grid">
                    <!-- Cards will be injected here -->
                </div>
                <div id="feed-sentinel" style="height: 20px; margin: 20px 0;"></div>
                <div id="feed-loading" class="feed-loading">
                    <div class="spinner"></div> Loading more questions...
                </div>
                <div id="feed-end-msg"
                    style="text-align: center; padding: 40px; color: var(--text-muted); display: none;">
                    <i data-lucide="check-circle"
                        style="width: 48px; height: 48px; margin-bottom: 10px; color: var(--accent);"></i>
                    <p>You're all caught up! Great work.</p>
                </div>
            </main>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const feedGrid = document.getElementById('feed-grid');
        const feedLoading = document.getElementById('feed-loading');
        const feedEndMsg = document.getElementById('feed-end-msg');
        let currentCategory = 'All';
        let isLoading = false;
        let hasMore = true;
        let observer;

        // Sound Generator
        const playFeedbackSound = (isCorrect) => {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                if (isCorrect) {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(660, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                } else {
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                }
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch (e) { /* audio not available */ }
        };

        // Render a single question card
        function renderCard(q) {
            const diffClass = q.difficulty.toLowerCase();
            const options = Array.isArray(q.options) ? q.options : JSON.parse(q.options);

            const card = document.createElement('article');
            card.className = 'card';
            card.dataset.questionId = q.id;
            card.innerHTML = `
                <div class="card-header">
                    <span class="badge">${q.subject}</span>
                    <div class="header-right">
                        ${q.recommendationReason ? `<span class="mastery-tag developing">${q.recommendationReason}</span>` : ''}
                        <i data-lucide="bookmark" style="width:18px; color:#64748b; cursor:pointer"></i>
                        <span class="badge difficulty ${diffClass}">${q.difficulty}</span>
                    </div>
                </div>
                <div class="card-body">
                    <h2 class="question">${q.question_text}</h2>
                    <div class="options-list">
                        ${options.map(opt => `<button class="opt-btn">${opt}</button>`).join('')}
                    </div>
                </div>
                <div class="card-footer">
                    <button class="submit-btn">Submit Answer</button>
                    <a href="ExplainPG.html" class="view-exp-btn" style="display: none;">
                        <i data-lucide="external-link" width="14"></i>
                        View Explanation
                    </a>
                </div>
            `;

            // Option selection
            card.querySelectorAll('.opt-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    card.querySelectorAll('.opt-btn').forEach(b => { b.classList.remove('active'); b.style.borderColor = 'transparent'; });
                    this.classList.add('active');
                    BrainFeedAPI.startTimer(); // start timing from first option click if not started
                });
            });

            // Submit logic
            const submitBtn = card.querySelector('.submit-btn');
            submitBtn.addEventListener('click', async function () {
                const selectedOption = card.querySelector('.opt-btn.active');
                if (!selectedOption) {
                    alert('Please select an option first!');
                    return;
                }

                const responseTime = BrainFeedAPI.getElapsedTime();
                this.disabled = true;
                this.textContent = 'Checking...';

                try {
                    const result = await BrainFeedAPI.submitAnswer(q.id, selectedOption.textContent, responseTime);

                    playFeedbackSound(result.isCorrect);

                    // Update option styling
                    if (result.isCorrect) {
                        selectedOption.style.borderColor = '#4ade80';
                        this.textContent = '✨ Correct!';
                        this.style.background = '#059669';
                    } else {
                        selectedOption.style.borderColor = '#f87171';
                        this.textContent = '❌ Incorrect';
                        this.style.background = '#dc2626';

                        // Highlight correct answer
                        card.querySelectorAll('.opt-btn').forEach(b => {
                            if (b.textContent === result.correctAnswer) {
                                b.style.borderColor = '#4ade80';
                                b.style.background = 'rgba(74, 222, 128, 0.1)';
                            }
                        });
                    }

                    // Disable all options
                    card.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);

                    // Show explanation link
                    const expLink = card.querySelector('.view-exp-btn');
                    expLink.style.display = 'flex';
                    setTimeout(() => expLink.style.opacity = '1', 10);

                    // Show mastery update
                    if (result.mastery) {
                        const msg = document.createElement('p');
                        msg.className = 'feedback-msg';
                        msg.style.cssText = 'text-align:center; margin-top:8px; font-size:0.8rem; color: var(--text-muted);';
                        msg.textContent = `${result.mastery.topic}: ${result.mastery.score}% (${result.mastery.level})`;
                        card.querySelector('.card-footer').appendChild(msg);
                    }

                    // Update streak
                    BrainFeedAPI.updateStreakDisplay(result.streak);

                    // Cognitive load alert
                    if (result.cognitiveLoad) {
                        showCognitiveAlert(result.cognitiveLoad.suggestion);
                    }

                } catch (err) {
                    console.error('Submit error:', err);
                    this.textContent = 'Submit Answer';
                    this.disabled = false;
                }

                // Start timer for next question
                BrainFeedAPI.startTimer();
            });

            return card;
        }

        // Load Feed Batch (Infinite Scroll)
        async function loadFeed(isInitial = false) {
            if (isLoading || !hasMore) return;
            isLoading = true;

            const feedLoading = document.getElementById('feed-loading');
            const feedEndMsg = document.getElementById('feed-end-msg');

            if (isInitial) {
                feedGrid.innerHTML = '';
                hasMore = true;
                feedEndMsg.style.display = 'none';
                feedLoading.style.display = 'flex';
            } else {
                feedLoading.style.display = 'flex'; // Show spinner at bottom
            }

            try {
                // Fetch 5 questions at a time
                const data = await BrainFeedAPI.fetchFeed(currentCategory);

                if (data.questions && data.questions.length > 0) {
                    data.questions.forEach(q => {
                        // Prevent duplicates
                        if (!document.querySelector(`[data-question-id="${q.id}"]`)) {
                            feedGrid.appendChild(renderCard(q));
                        }
                    });
                    lucide.createIcons();
                } else {
                    hasMore = false;
                    feedEndMsg.style.display = 'block';
                    if (observer) observer.disconnect();
                }

                // Cognitive Load Alert
                if (data.cognitiveLoad && data.cognitiveLoad.fatigueDetected) {
                    showCognitiveAlert(data.cognitiveLoad.suggestion);
                }

            } catch (e) {
                console.error('Feed error:', e);
            } finally {
                isLoading = false;
                if (!isInitial) feedLoading.style.display = 'none'; // Hide bottom spinner
                if (isInitial && feedGrid.children.length === 0 && hasMore === false) {
                    feedGrid.innerHTML = '<div style="text-align:center;padding:40px;width:100%">No questions found.</div>';
                    feedLoading.style.display = 'none';
                } else if (isInitial) {
                    feedLoading.style.display = 'none';
                }
            }
        }

        // Cognitive load alert
        function showCognitiveAlert(message) {
            const alert = document.getElementById('cognitive-alert');
            alert.textContent = '🧠 ' + message;
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 8000);
        }

        // Initialize Infinite Scroll
        function initInfiniteScroll() {
            const sentinel = document.getElementById('feed-sentinel');
            if (!sentinel) return;

            observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && hasMore && !isLoading) {
                    loadFeed(false);
                }
            }, { rootMargin: '200px' });
            observer.observe(sentinel);
        }

        // Category filter clicks
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function () {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                loadFeed(true); // Reset and reload
            });
        });

        // User avatar initials
        (function () {
            const user = BrainFeedAPI.getUser();
            if (user) {
                const initials = (user.name || 'U').split(' ').map(n => n[0]).join('').toUpperCase();
                const avatar = document.getElementById('user-avatar');
                if (avatar) avatar.textContent = initials;
            }
        })();

        // Initial load
        loadFeed(true).then(() => {
            initInfiniteScroll();
        });
    </script>
</body>

</html>
