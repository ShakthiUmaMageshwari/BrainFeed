<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrainFeed - Auth</title>
    <link rel="icon" type="image/x-icon" href="/asset/imgages/download.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/asset/script/script.js"></script>
    <style>
        :root {
            --bg-dark: #0a111e;
            --bg-glow: #1a2a44;
            --accent: #4285f4;
            --accent-glow: #5ec0f8;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow-x: hidden;
            padding: 20px;
        }

        /* ----- AUTH CARD ----- */
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: clamp(30px, 5vw, 40px);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        /* LOGO */
        .logo-container {
            margin-bottom: 25px;
        }

        .brain-icon img {
            width: 70px;
            height: 70px;
            filter: brightness(1.2) drop-shadow(0 0 10px var(--accent));
        }

        h1,
        h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* ----- INPUTS ----- */
        .input-group {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 14px 18px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-group i {
            width: 18px;
            color: var(--text-dim);
            margin-right: 12px;
        }

        .input-group input,
        .input-group select {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
        }

        .input-group select option {
            background: #1a2a44;
            color: white;
        }

        /* ----- ACTIONS ----- */
        .forgot-link {
            display: block;
            text-align: right;
            color: var(--accent-glow);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            margin: -5px 5px 25px 0;
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(90deg, var(--accent), var(--accent-glow));
            color: white;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(66, 133, 244, 0.3);
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(66, 133, 244, 0.4);
        }

        .btn-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ----- EXAM CHIPS ----- */
        .exam-prep label {
            display: block;
            margin: 20px 0 12px;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .chip {
            background: var(--glass);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: 0.3s;
            color: var(--text-dim);
        }

        .chip.active {
            border-color: var(--accent);
            background: rgba(66, 133, 244, 0.2);
            color: white;
        }

        /* ----- DIVIDER & SOCIAL ----- */
        .divider {
            margin: 30px 0;
            position: relative;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111a2a;
            padding: 0 15px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .social-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-circle {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .social-circle:hover {
            transform: translateY(-3px);
            background: #f0f0f0;
        }

        .footer-text {
            margin-top: 25px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .footer-text a {
            color: var(--accent-glow);
            text-decoration: none;
            font-weight: 700;
        }

        .hidden {
            display: none;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }

        .success-msg {
            color: #4ade80;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px 20px;
                border-radius: 24px;
            }

            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="logo-container">
            <div class="brain-icon">
                <img src="/asset/imgages/IMG_20260215_190534-removebg-preview.png" alt="BrainFeed">
            </div>
        </div>

        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="auth-form">
            <h1>Welcome Back</h1>
            <p class="subtitle">Log in to continue your daily growth.</p>
            <p class="error-msg" id="login-error"></p>

            <div class="input-group">
                <i data-lucide="mail"></i>
                <input type="email" id="login-email" placeholder="Email Address">
            </div>
            <div class="input-group">
                <i data-lucide="lock"></i>
                <input type="password" id="login-password" placeholder="Password">
            </div>

            <a href="#" class="forgot-link">Forgot Password?</a>

            <button id="login-btn" class="btn-main">Log In</button>

            <div class="divider"><span>OR CONTINUE WITH</span></div>

            <div class="social-group">
                <div class="social-circle"><img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png"
                        width="20"></div>
                <div class="social-circle" style="color:#1DA1F2"><i data-lucide="twitter"></i></div>
                <div class="social-circle" style="color:#333"><i data-lucide="github"></i></div>
            </div>

            <p class="footer-text">New here? <a href="javascript:void(0)" onclick="toggleAuth()">Create Account</a></p>
        </div>

        <!-- REGISTER SCREEN -->
        <div id="register-screen" class="auth-form hidden">
            <h2>Get Started</h2>
            <p class="subtitle">Join the elite learners today.</p>
            <p class="error-msg" id="register-error"></p>
            <p class="success-msg" id="register-success"></p>

            <div class="input-group"><i data-lucide="user"></i><input type="text" id="reg-name" placeholder="Full Name">
            </div>
            <div class="input-group"><i data-lucide="mail"></i><input type="email" id="reg-email"
                    placeholder="Email Address"></div>
            <div class="input-group"><i data-lucide="lock"></i><input type="password" id="reg-password"
                    placeholder="Create Password"></div>

            <div class="input-group">
                <i data-lucide="graduation-cap"></i>
                <select id="reg-department" required>
                    <option value="" disabled selected>Department</option>
                    <option value="CSE">Computer Science</option>
                    <option value="AIDS">AI & Data Science</option>
                    <option value="EEE">Electrical Engineering</option>
                    <option value="ECE">Electronics</option>
                </select>
            </div>

            <div class="exam-prep">
                <label>Target Exams</label>
                <div class="chips" id="examChips">
                    <span class="chip" data-value="UPSC">UPSC</span>
                    <span class="chip" data-value="JEE">JEE</span>
                    <span class="chip" data-value="GATE">GATE</span>
                    <span class="chip" data-value="CAT">CAT</span>
                </div>
                <input type="hidden" id="selectedExams">
            </div>

            <button id="register-btn" class="btn-main">Create Account</button>
            <p class="footer-text">Have an account? <a href="javascript:void(0)" onclick="toggleAuth()">Log In</a></p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Redirect if already logged in
        if (BrainFeedAPI.isLoggedIn()) {
            window.location.href = 'MainFeedPG.html';
        }

        // Auth Toggle
        function toggleAuth() {
            document.getElementById("login-screen").classList.toggle("hidden");
            document.getElementById("register-screen").classList.toggle("hidden");
        }

        // Handle URL params
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("mode") === "register") {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("register-screen").classList.remove("hidden");
            }
        });

        // Chip Selection
        const chips = document.querySelectorAll("#examChips .chip");
        const hiddenInput = document.getElementById("selectedExams");
        chips.forEach(chip => {
            chip.addEventListener("click", () => {
                chip.classList.toggle("active");
                const selected = Array.from(document.querySelectorAll("#examChips .chip.active"))
                    .map(c => c.dataset.value);
                hiddenInput.value = selected.join(",");
            });
        });

        // LOGIN
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                errorEl.textContent = 'Please fill in all fields.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';
            errorEl.style.display = 'none';

            try {
                await BrainFeedAPI.login(email, password);
                window.location.href = 'MainFeedPG.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Login failed.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Log In';
            }
        });

        // REGISTER
        document.getElementById('register-btn').addEventListener('click', async () => {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const department = document.getElementById('reg-department').value;
            const targetExams = document.getElementById('selectedExams').value;
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            const btn = document.getElementById('register-btn');

            if (!name || !email || !password) {
                errorEl.textContent = 'Please fill in all required fields.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';
            errorEl.style.display = 'none';

            try {
                await BrainFeedAPI.register(name, email, password, department, targetExams);
                successEl.textContent = 'Account created! Redirecting...';
                successEl.style.display = 'block';
                setTimeout(() => { window.location.href = 'MainFeedPG.html'; }, 800);
            } catch (err) {
                errorEl.textContent = err.message || 'Registration failed.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        // Enter key support
        document.getElementById('login-password').addEventListener('keyup', e => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });
        document.getElementById('reg-password').addEventListener('keyup', e => {
            if (e.key === 'Enter') document.getElementById('register-btn').click();
        });
    </script>
</body>

</html>
