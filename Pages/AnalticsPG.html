<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrainFeed - AI Analysis</title>
    <link rel="icon" type="image/x-icon" href="/asset/imgages/download.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/asset/script/script.js"></script>
    <style>
        :root {
            --bg-dark: #0a111e;
            --bg-glow: #1a2a44;
            --accent: #4285f4;
            --accent-glow: #5ec0f8;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
        }

        .app-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .top-nav {
            padding: clamp(15px, 4dvh, 30px) 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .nav-left-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .nav-icon {
            color: #fff;
            width: 22px;
            cursor: pointer;
        }

        .ai-icon {
            color: var(--accent-glow);
            filter: drop-shadow(0 0 5px var(--accent));
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2d3748;
            border: 1px solid var(--border);
        }

        .streak-container {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 138, 0, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 138, 0, 0.3);
        }

        .streak-icon {
            width: 16px;
            height: 16px;
            color: #ff8a00;
            filter: drop-shadow(0 0 5px #ff8a00);
        }

        #streak-score {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ff8a00;
        }

        .dashboard-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px 120px;
            scrollbar-width: none;
        }

        .dashboard-scroll::-webkit-scrollbar {
            display: none;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .premium-card {
            grid-column: 1 / -1;
            position: relative;
            background: linear-gradient(135deg, rgba(66, 133, 244, 0.15), rgba(0, 0, 0, 0));
            border: 1px solid rgba(94, 192, 248, 0.3);
            border-radius: 28px;
            padding: 25px;
            overflow: hidden;
        }

        .card-glow {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            opacity: 0.3;
            filter: blur(30px);
        }

        .report-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin: 15px 0;
        }

        .score-num {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }

        .confidence-badge {
            background: rgba(0, 230, 118, 0.1);
            color: #00e676;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e676;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.8s ease;
        }

        .bar-fill.highlight {
            background: #ff5252;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.3);
        }

        .bar-fill.good {
            background: #4ade80;
        }

        .chart-container {
            height: 120px;
            margin-top: 10px;
        }

        .analytics-row-inner {
            display: flex;
            gap: 15px;
        }

        .half {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .val {
            font-size: 1.8rem;
            font-weight: 800;
            display: block;
            margin-top: 10px;
        }

        .circular-chart {
            width: 60px;
            height: 60px;
        }

        .circle {
            fill: none;
            stroke: var(--accent-glow);
            stroke-width: 3;
            stroke-linecap: round;
        }

        .inner-val {
            position: absolute;
            font-size: 0.9rem;
            font-weight: 700;
            transform: translateY(22px);
        }

        .rec-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .rec-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            transition: 0.2s;
            cursor: pointer;
        }

        .rec-item:hover {
            border-color: var(--accent);
            background: rgba(66, 133, 244, 0.1);
        }

        /* Profile type badge */
        .profile-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .profile-badge.fast {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .profile-badge.slow {
            background: rgba(66, 133, 244, 0.15);
            color: #4285f4;
        }

        .profile-badge.guesser {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .profile-badge.struggling {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .profile-badge.inconsistent {
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
        }

        .risk-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .risk-indicator.low {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
        }

        .risk-indicator.medium {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }

        .risk-indicator.high {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
        }

        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: var(--text-dim);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* SIDEBAR / BOTTOM NAV */
        .side-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 12px 10px 25px;
            background: rgba(10, 17, 30, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-dim);
            text-decoration: none;
            flex: 1;
        }

        .nav-tab.active {
            color: var(--accent);
        }

        .nav-text-mobile {
            font-size: 0.65rem;
        }

        .nav-text-desktop {
            display: none;
        }

        .action-footer {
            padding: 15px 20px 110px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .primary-btn {
            width: 100%;
            padding: 16px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(90deg, var(--accent), var(--accent-glow));
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .secondary-btn {
            background: transparent;
            color: var(--text-dim);
            border: none;
            font-weight: 600;
            cursor: pointer;
            padding: 10px;
            transition: 0.3s;
        }

        .secondary-btn:hover {
            color: #fff;
        }

        @media (min-width: 1024px) {
            .app-shell {
                display: grid;
                grid-template-columns: 260px 1fr;
                grid-template-areas: "sidebar main";
            }

            .side-nav {
                grid-area: sidebar;
                position: static;
                flex-direction: column;
                height: 100vh;
                padding: 40px 20px;
                border-top: none;
                border-right: 1px solid var(--border);
                justify-content: flex-start;
                gap: 12px;
                background: transparent;
            }

            .nav-tab {
                flex-direction: row;
                padding: 15px 20px;
                border-radius: 16px;
                gap: 15px;
                flex: none;
                width: 100%;
            }

            .nav-tab:hover {
                background: var(--glass);
            }

            .nav-tab.active {
                background: rgba(66, 133, 244, 0.1);
            }

            .nav-text-mobile {
                display: none;
            }

            .nav-text-desktop {
                display: block;
                font-size: 1rem;
            }

            .main-content {
                grid-area: main;
            }

            .top-nav {
                padding: 30px 40px;
            }

            .dashboard-scroll {
                padding: 0 40px 40px;
                height: calc(100vh - 100px);
            }

            .analytics-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }

            .action-footer {
                flex-direction: row;
                padding: 20px 0;
                max-width: 1200px;
                margin: 0 auto;
                width: 100%;
            }

            .primary-btn {
                width: auto;
                padding: 16px 40px;
            }

            .glass-card:hover {
                transform: translateY(-5px);
                border-color: var(--accent);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }
        }

        @media (max-width: 480px) {
            html {
                font-size: 13px;
            }

            .score-num {
                font-size: 2.5rem;
            }

            .glass-card {
                padding: 16px;
            }

            .dashboard-scroll {
                padding: 10px 15px 120px;
            }

            .nav-title {
                font-size: 1rem;
            }
        }

        @media print {

            /* Hide UI elements */
            .side-nav,
            .action-footer,
            .nav-icon,
            .user-avatar,
            .streak-container,
            .loading-state,
            .card-glow,
            header,
            button,
            .top-nav {
                display: none !important;
            }

            /* Reset Page */
            @page {
                margin: 2cm;
                size: auto;
            }

            html,
            body {
                background: #fff !important;
                color: #000 !important;
                height: auto !important;
                overflow: visible !important;
                margin: 0 !important;
                padding: 0 !important;
                font-size: 12pt !important;
            }

            /* Layout Resets */
            .app-shell,
            .main-content,
            .dashboard-scroll,
            .analytics-grid {
                display: block !important;
                position: static !important;
                height: auto !important;
                width: 100% !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* Card Styling for Print */
            .glass-card,
            .premium-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #000 !important;
                background: #fff !important;
                box-shadow: none !important;
                margin-bottom: 20px !important;
                padding: 15px !important;
                color: #000 !important;
                backdrop-filter: none !important;
                border-radius: 8px !important;
            }

            /* Aggressive Text & Content Override */
            * {
                color: #000 !important;
                text-shadow: none !important;
                background-color: transparent !important;
                box-shadow: none !important;
            }

            /* Exceptions for Graphs/Visuals */
            .bar-bg {
                border: 1px solid #000 !important;
                height: 10px !important;
            }

            .bar-fill {
                background-color: #000 !important;
                /* Force black bars for best contrast, or keep gray */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* If user wants colored bars, we can allow it, but text must be black */

            /* SVGs */
            svg {
                break-inside: avoid;
            }

            svg path,
            svg polyline,
            svg circle {
                stroke: #000 !important;
                fill: none !important;
            }

            /* Specific text adjustments */
            h3 {
                border-bottom: 1px solid #000;
                padding-bottom: 5px;
                margin-bottom: 10px;
                font-weight: bold !important;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <nav class="side-nav">
            <a href="./MainFeedPG.html" class="nav-tab">
                <i data-lucide="home"></i>
                <span class="nav-text-mobile">Home</span>
                <span class="nav-text-desktop">Home Feed</span>
            </a>
            <a href="./PostPG.html" class="nav-tab">
                <i data-lucide="square-plus"></i>
                <span class="nav-text-mobile">Post</span>
                <span class="nav-text-desktop">New Post</span>
            </a>
            <a href="./AnalticsPG.html" class="nav-tab active">
                <i data-lucide="bar-chart-3"></i>
                <span class="nav-text-mobile">Analytics</span>
                <span class="nav-text-desktop">Analytics</span>
            </a>
            <a href="./notificationPG.html" class="nav-tab">
                <i data-lucide="bell"></i>
                <span class="nav-text-mobile">Alerts</span>
                <span class="nav-text-desktop">Notifications</span>
            </a>
            <a href="./ProfilePG.html" class="nav-tab">
                <i data-lucide="user"></i>
                <span class="nav-text-mobile">Profile</span>
                <span class="nav-text-desktop">Profile</span>
            </a>
        </nav>

        <div class="main-content">
            <header class="top-nav">
                <div class="nav-left-group">
                    <i data-lucide="arrow-left" class="nav-icon" onclick="history.back()"></i>
                    <h1 class="nav-title">AI Analysis</h1>
                </div>
                <div class="nav-right">
                    <div class="streak-container">
                        <i data-lucide="flame" class="streak-icon"></i>
                        <span id="streak-score">0</span>
                    </div>
                    <i data-lucide="bell" class="nav-icon"></i>
                    <div class="user-avatar" id="user-avatar"
                        style="display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.7rem;color:#fff;">
                    </div>
                </div>
            </header>

            <main class="dashboard-scroll">
                <div class="analytics-grid" id="analytics-grid">
                    <div class="loading-state" style="grid-column: 1/-1;">
                        <div class="spinner"></div> Loading AI-powered analytics...
                    </div>
                </div>

                <footer class="action-footer" id="action-footer" style="display:none;">
                    <button class="primary-btn" id="generate-btn">Generate Personalized Study Plan</button>
                    <button class="secondary-btn" id="download-btn">Download Full Report</button>
                </footer>
            </main>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function loadAnalytics() {
            const grid = document.getElementById('analytics-grid');

            if (!BrainFeedAPI.isLoggedIn()) {
                grid.innerHTML = '<div class="loading-state" style="grid-column:1/-1; flex-direction:column; gap:15px;"><p>Please log in to view your analytics.</p><a href="LoginPG.html" style="color:var(--accent); font-weight:600;">Go to Login</a></div>';
                return;
            }

            try {
                const data = await BrainFeedAPI.fetchAnalytics();
                grid.innerHTML = '';

                // === 1. PREDICTED PERFORMANCE (Engine 2) ===

                // === 1. PREDICTED PERFORMANCE (Engine 2) ===
                let predScore = data.prediction?.predictedScore ?? '--';
                if (predScore === 0 && data.prediction?.confidence === 'Low') predScore = '--';

                const predConfidence = data.prediction?.confidence || 'Low';
                const predTrend = data.prediction?.trend || 'Stable';
                const predMsg = data.examReadiness?.message || 'Keep practicing to unlock predictions.';

                grid.innerHTML += `
                <section class="premium-card">
                    <div class="card-glow"></div>
                    <h3>My Learning Intelligence</h3>
                    <div class="report-main">
                        <div class="score-display">
                            <span class="score-num">${predScore}<span style="font-size:1.5rem">%</span></span>
                            <p style="color: var(--text-dim); font-size: 0.8rem;">Predicted Score</p>
                        </div>
                        <div class="confidence-badge"><span class="dot"></span> Confidence: ${predConfidence}</div>
                    </div>
                    <p style="font-style: italic; color: #cbd5e0; font-size: 0.9rem;">"${predMsg}"</p>
                    <div style="margin-top:12px; display:flex; gap:15px; flex-wrap:wrap;">
                        <span style="font-size:0.8rem; color:var(--text-dim);">Trend: <strong style="color:${predTrend === 'Improving' ? '#4ade80' : predTrend === 'Declining' ? '#f87171' : '#fbbf24'}">${predTrend}</strong></span>
                        <span style="font-size:0.8rem; color:var(--text-dim);">Weekly: <strong style="color:#4285f4">${data.prediction?.weeklyImprovement || 0}%</strong></span>
                    </div>
                </section>`;

                // === 2. LEARNING PROFILE (Engine 4) ===
                const profile = data.learningProfile || {};
                const profileClass = profile.type?.includes('Fast') ? 'fast' : profile.type?.includes('Slow') ? 'slow' : profile.type?.includes('Guesser') ? 'guesser' : profile.type?.includes('Struggling') ? 'struggling' : 'inconsistent';
                grid.innerHTML += `
                <section class="glass-card">
                    <h3>Learning Profile</h3>
                    <div class="profile-badge ${profileClass}">🧠 ${profile.type || 'New User'}</div>
                    <p style="font-size:0.85rem; color:var(--text-dim); margin-top:8px;">${profile.description || 'Answer more questions to reveal your learning profile.'}</p>
                    ${profile.features ? `<div style="margin-top:12px; display:flex; gap:12px; flex-wrap:wrap; font-size:0.75rem; color:var(--text-dim);">
                        <span>Accuracy: <strong style="color:#fff">${profile.features.accuracy}%</strong></span>
                        <span>Avg Time: <strong style="color:#fff">${profile.features.avgTime}s</strong></span>
                        <span>Streak: <strong style="color:#fff">${profile.features.streakRatio}%</strong></span>
                    </div>` : ''}
                </section>`;

                // === 3. WEAK AREA DETECTION (Mastery - Engine 1) ===
                let masteryHtml = '<section class="glass-card"><h3>Topic Mastery</h3>';
                const masteryList = (data.mastery || []).sort((a, b) => a.score - b.score).slice(0, 6);
                if (masteryList.length === 0) {
                    masteryHtml += '<p style="color:var(--text-dim); font-size:0.85rem;">No data yet. Start answering questions!</p>';
                } else {
                    masteryList.forEach(m => {
                        const barClass = m.score < 40 ? 'highlight' : m.score >= 75 ? 'good' : '';
                        const color = m.score < 40 ? '#ff5252' : m.score >= 75 ? '#4ade80' : 'var(--text-dim)';
                        masteryHtml += `<div class="progress-row">
                            <span style="width:100px; font-size:0.8rem;">${m.topic}</span>
                            <div class="bar-bg"><div class="bar-fill ${barClass}" style="width:${m.score}%"></div></div>
                            <span style="color:${color}; font-size:0.85rem;">${m.score}%</span>
                        </div>`;
                    });
                }
                masteryHtml += '</section>';
                grid.innerHTML += masteryHtml;

                // === 4. PERFORMANCE TREND ===
                const trend = data.performanceTrend || [];
                let trendSvg = '';
                if (trend.length >= 2) {
                    const maxAcc = Math.max(...trend.map(t => t.accuracy), 100);
                    const points = trend.map((t, i) => {
                        const x = (i / (trend.length - 1)) * 400;
                        const y = 140 - (t.accuracy / maxAcc) * 130;
                        return `${x},${y}`;
                    }).join(' ');
                    const lastPoint = points.split(' ').pop();
                    const [lx, ly] = lastPoint.split(',');
                    trendSvg = `<svg viewBox="0 0 400 150" width="100%">
                        <polyline points="${points}" fill="none" stroke="var(--accent-glow)" stroke-width="3" style="filter: drop-shadow(0 0 5px var(--accent))" />
                        <circle cx="${lx}" cy="${ly}" r="5" fill="#fff" />
                    </svg>`;
                } else {
                    trendSvg = '<p style="color:var(--text-dim); font-size:0.85rem; text-align:center;">Not enough data for trend chart.</p>';
                }

                grid.innerHTML += `
                <section class="glass-card">
                    <h3>Performance Trend</h3>
                    <div class="chart-container">${trendSvg}</div>
                    <div style="display:flex; justify-content:space-between; font-size:0.65rem; color:var(--text-dim); margin-top:10px;">
                        ${trend.map(t => `<span>${t.day?.slice(5) || ''}</span>`).join('')}
                    </div>
                </section>`;

                // === 5. SPEED & FOCUS (Engine 10) ===
                const features = data.features || {};
                const focus = data.cognitiveLoad || {};
                grid.innerHTML += `
                <div class="analytics-row-inner">
                    <div class="glass-card half">
                        <h3>Learning Speed</h3>
                        <span class="val">${features.avgResponseTime || 0}s</span>
                        <span style="font-size:0.7rem; color:var(--text-dim)">Avg Time/Question</span>
                    </div>
                    <div class="glass-card half">
                        <h3>Focus Score</h3>
                        <div style="position:relative; display:flex; justify-content:center;">
                            <svg viewBox="0 0 36 36" class="circular-chart">
                                <path class="circle" stroke-dasharray="${(focus.focusScore || 0) * 10}, 100"
                                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <span class="inner-val">${focus.focusScore ?? 'N/A'}</span>
                        </div>
                    </div>
                </div>`;

                // === 6. DROP-OFF RISK (Engine 7) ===
                const risk = data.dropoffRisk || {};
                grid.innerHTML += `
                <section class="glass-card">
                    <h3>Engagement & Retention</h3>
                    <div style="display:flex; justify-content:space-between; text-align:center; margin-bottom:15px;">
                        <div><span style="font-weight:800; display:block;">${data.engagement?.streak || 0}</span><small style="color:var(--text-dim)">Streak</small></div>
                        <div><span style="font-weight:800; display:block;">${data.engagement?.overallAccuracy || 0}%</span><small style="color:var(--text-dim)">Accuracy</small></div>
                        <div><span style="font-weight:800; display:block;">${data.engagement?.totalAttempts || 0}</span><small style="color:var(--text-dim)">Solved</small></div>
                    </div>
                    <div class="risk-indicator ${(risk.riskLevel || 'low').toLowerCase()}">
                        ${risk.riskLevel === 'High' ? '⚠️' : risk.riskLevel === 'Medium' ? '⚡' : '✅'} Drop-off Risk: ${risk.riskProbability || 0}% (${risk.riskLevel || 'Low'})
                    </div>
                </section>`;

                // === 7. RECOMMENDATIONS (Engine 9) ===
                const recs = data.recommendations || [];
                let recHtml = '<section class="glass-card"><h3>AI Recommendations</h3><div class="rec-grid">';
                if (recs.length > 0) {
                    recs.forEach(r => { recHtml += `<div class="rec-item" title="${r.reason}: Mastery ${r.mastery}%">${r.topic}</div>`; });
                } else {
                    recHtml += '<p style="color:var(--text-dim); font-size:0.85rem;">Start answering to get recommendations.</p>';
                }
                recHtml += '</div></section>';
                grid.innerHTML += recHtml;

                // === 8. EXAM READINESS (Engine 5) ===
                const exam = data.examReadiness || {};
                if (exam.readinessScore !== undefined) {
                    grid.innerHTML += `
                    <section class="glass-card">
                        <h3>Exam Readiness</h3>
                        <div style="text-align:center; padding:15px;">
                             <span style="font-size:2.5rem; font-weight:800; display:block; color:var(--accent-glow)">${exam.readinessScore || 0}%</span>
                             <span style="font-size:1rem; font-weight:600;">${exam.readinessLabel || 'Not Ready'}</span>
                        </div>
                        <p style="font-size:0.8rem; text-align:center; color:var(--text-dim);">${exam.message || 'Keep practicing.'}</p>
                    </section>`;
                }

                // === NEW ML FEATURES (Engines 11-15) ===

                // 11. Time of Day
                const tod = data.timeOfDay || {};
                if (tod.bestSlot && tod.slots) {
                    const best = tod.bestSlot;
                    grid.innerHTML += `
                    <section class="glass-card">
                        <h3>⏰ Peak Performance Time</h3>
                        <div style="text-align:center; padding:10px 0;">
                            <span style="font-size:2rem; display:block;">${best === 'morning' ? '🌅 Morning' : best === 'afternoon' ? '☀️ Afternoon' : best === 'evening' ? '🌆 Evening' : '🌙 Night'}</span>
                            <p style="color:var(--text-dim); font-size:0.85rem; margin-top:5px;">Your brain is most active during this time.</p>
                        </div>
                        <div style="font-size:0.8rem; color: #cbd5e0; margin-top:10px; background:rgba(255,255,255,0.05); padding:10px; border-radius:12px;">
                            ${tod.recommendation || 'Keep practicing to get personalized time insights.'}
                        </div>
                    </section>`;
                }

                // 12. Subject Affinity (Updated with Speed)
                const affinity = data.subjectAffinity || {};
                if (affinity.subjects && affinity.subjects.length > 0) {
                    let affinityHtml = `<section class="glass-card"><h3>📚 Subject Strength & Speed</h3>`;
                    affinity.subjects.slice(0, 5).forEach(s => {
                        affinityHtml += `
                        <div style="margin-bottom:15px;">
                            <div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:5px;">
                                <span>${s.subject}</span>
                                <span style="color:var(--text-dim); font-size:0.75rem;">Avg: <strong style="color:#fff">${s.avgSpeed}s</strong></span>
                            </div>
                            <div class="bar-bg" style="margin-bottom:4px;"><div class="bar-fill" style="width:${s.affinityScore}%; background:${s.affinityScore > 70 ? '#4ade80' : s.affinityScore > 40 ? '#fbbf24' : '#ff5252'}"></div></div>
                            <div style="text-align:right; font-size:0.7rem; color:var(--text-dim);">Score: ${s.affinityScore}/100</div>
                        </div>`;
                    });
                    affinityHtml += `</section>`;
                    grid.innerHTML += affinityHtml;
                }

                // === 8. EXAM READINESS COMPARISON (Engine 5 - Multi-Exam) ===
                const exams = Array.isArray(data.examReadiness) ? data.examReadiness : [data.examReadiness];
                if (exams.length > 0) {
                    let examHtml = `<section class="glass-card"><h3>🏆 Exam Readiness Comparison</h3><div style="display:flex; justify-content:space-around; align-items:flex-end; height:120px; padding-top:20px;">`;

                    exams.forEach(ex => {
                        const height = Math.max(10, ex.readinessScore);
                        const color = ex.readinessScore > 70 ? '#4ade80' : ex.readinessScore > 40 ? '#fbbf24' : '#f87171';
                        examHtml += `
                        <div style="display:flex; flex-direction:column; align-items:center; width:18%;">
                            <span style="font-size:0.75rem; font-weight:700; color:${color}; margin-bottom:5px;">${ex.readinessScore}%</span>
                            <div class="bar-fill" style="width:100%; height:${height}%; background:${color}; border-radius:4px 4px 0 0; min-height:4px;"></div>
                            <span style="font-size:0.7rem; color:var(--text-dim); margin-top:8px;">${ex.exam}</span>
                        </div>`;
                    });

                    examHtml += `</div><p style="text-align:center; font-size:0.75rem; color:var(--text-dim); margin-top:15px;">Targeting <strong>${data.user?.targetExam || 'GATE'}</strong>? You are ${exams.find(e => e.exam === (data.user?.targetExam || 'GATE'))?.readinessScore || 0}% ready.</p></section>`;
                    grid.innerHTML += examHtml;
                }
                // 13. Learning Velocity
                const velocity = data.learningVelocity || {};
                const velColor = velocity.overallVelocity > 15 ? '#4ade80' : velocity.overallVelocity > 0 ? '#fbbf24' : '#ff5252';
                grid.innerHTML += `
                <section class="glass-card">
                    <h3>🚀 Learning Velocity</h3>
                    <div style="display:flex; align-items:center; justify-content:center; flex-direction:column; padding:15px;">
                        <span style="font-size:2.5rem; font-weight:800; color:${velColor}">${velocity.overallVelocity > 0 ? '+' : ''}${velocity.overallVelocity}</span>
                        <span style="font-size:0.9rem; font-weight:600; margin-top:5px; color:${velColor}">${velocity.velocityLabel}</span>
                    </div>
                    ${velocity.fastLearnerTopics && velocity.fastLearnerTopics.length > 0 ?
                        `<p style="font-size:0.75rem; color:var(--text-dim); text-align:center; margin-top:5px;">Fastest learning in: <span style="color:#fff">${velocity.fastLearnerTopics[0]}</span></p>` : ''}
                </section>`;

                // 14. Error Patterns
                const errors = data.errorPatterns || {};
                if (errors.totalErrors > 0) {
                    const breakdown = errors.errorBreakdown || {};
                    grid.innerHTML += `
                    <section class="glass-card">
                        <h3>❌ Error Analysis</h3>
                        <div style="display:flex; justify-content:space-around; margin:15px 0;">
                            <div style="text-align:center"><span style="display:block; font-weight:700; color:#f87171">${breakdown.guessing}</span><small style="font-size:0.7rem; color:var(--text-dim)">Guessing</small></div>
                            <div style="text-align:center"><span style="display:block; font-weight:700; color:#fbbf24">${breakdown.overthinking}</span><small style="font-size:0.7rem; color:var(--text-dim)">Overthinking</small></div>
                            <div style="text-align:center"><span style="display:block; font-weight:700; color:#cbd5e0">${breakdown.careless}</span><small style="font-size:0.7rem; color:var(--text-dim)">Careless</small></div>
                        </div>
                        <div style="font-size:0.8rem; background:rgba(248, 113, 113, 0.1); border:1px solid rgba(248, 113, 113, 0.2); padding:10px; border-radius:10px;">
                            <strong>Diagnosis:</strong> ${errors.dominantErrorType} errors.<br>
                            <span style="color:var(--text-dim); font-size:0.75rem;">${errors.actionableFix}</span>
                        </div>
                    </section>`;
                }

                // 15. Session Quality
                const session = data.sessionQuality || {};
                if (session.lastSessionGrade !== 'N/A') {
                    const gradeColor = session.lastSessionGrade === 'A' ? '#4ade80' : session.lastSessionGrade === 'B' ? '#60a5fa' : session.lastSessionGrade === 'C' ? '#fbbf24' : '#f87171';
                    grid.innerHTML += `
                     <section class="glass-card">
                         <h3>📋 Last Session Quality</h3>
                         <div style="display:flex; align-items:center; gap:15px;">
                             <div style="font-size:2.5rem; font-weight:800; color:${gradeColor}; border:3px solid ${gradeColor}; width:60px; height:60px; display:flex; align-items:center; justify-content:center; border-radius:50%;">${session.lastSessionGrade}</div>
                             <div>
                                 <span style="display:block; font-size:0.9rem; color:#fff">Score: ${session.lastSessionScore}/100</span>
                                 <span style="font-size:0.75rem; color:var(--text-dim)">${session.minutes || 0} min total focus</span>
                             </div>
                         </div>
                         <p style="font-size:0.75rem; color:var(--text-dim); margin-top:12px;">Recommendation: <span style="color:#fff">${session.recommendation}</span></p>
                     </section>`;
                }

                // Show footer
                document.getElementById('action-footer').style.display = 'flex';

                // Update streak
                BrainFeedAPI.updateStreakDisplay(data.engagement?.streak || 0);

            } catch (err) {
                console.error('Analytics error:', err);
                grid.innerHTML = '<div class="loading-state" style="grid-column:1/-1;">Failed to load analytics. Please try again.</div>';
            }
        }

        // Actions
        document.getElementById('download-btn').addEventListener('click', () => window.print());
        document.getElementById('generate-btn').addEventListener('click', function () {
            const originalText = this.innerText;
            this.innerText = 'Analyzing your data...';
            this.style.opacity = '0.7';
            setTimeout(() => {
                alert('Study Plan Generated! Check your daily feed for personalized questions.');
                this.innerText = originalText;
                this.style.opacity = '1';
            }, 1500);
        });

        // User avatar initials
        (function () {
            const user = BrainFeedAPI.getUser();
            if (user) {
                const initials = (user.name || 'U').split(' ').map(n => n[0]).join('').toUpperCase();
                const avatar = document.getElementById('user-avatar');
                if (avatar) avatar.textContent = initials;
            }
        })();

        // Load on page ready
        loadAnalytics();
    </script>
</body>

</html>
