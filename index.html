<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrainFeed - Welcome</title>
     <link rel="icon" type="image/x-icon" href="./asset/imgages/download.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0a111e;
            --bg-glow: #1a2a44;
            --accent: #4285f4;
            --accent-glow: #5ec0f8;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
        }

        /* ----- MAIN CONTAINER ----- */
        .container {
            width: 100%;
            max-width: 450px; /* Default for mobile */
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        /* ----- BRAIN LOGO & ANIMATION ----- */
        .logo-container {
            position: relative;
            margin-bottom: 30px;
        }

        .brain-icon img {
            width: 140px;
            height: 140px;
            filter: brightness(1.2) drop-shadow(0 0 15px var(--accent));
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: brightness(1.2) drop-shadow(0 0 15px var(--accent)); }
            50% { transform: scale(1.05); filter: brightness(1.5) drop-shadow(0 0 30px var(--accent-glow)); }
        }

        /* ----- TYPOGRAPHY ----- */
        .brand-name {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--accent-glow);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 50px;
            max-width: 300px;
        }

        /* ----- BUTTON GROUP ----- */
        .button-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 18px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--accent), var(--accent-glow));
            color: white;
            box-shadow: 0 10px 25px rgba(66, 133, 244, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(66, 133, 244, 0.4);
        }

        .btn-secondary {
            background: var(--glass);
            color: white;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* ----- RESPONSIVE: TABLET & DESKTOP ----- */
        @media (min-width: 768px) {
            .container {
                max-width: 600px;
                background: rgba(255, 255, 255, 0.02);
                padding: 60px;
                border-radius: 40px;
                border: 1px solid var(--border);
                backdrop-filter: blur(20px);
            }

            .brand-name { font-size: 4.5rem; }
            .description { max-width: 450px; font-size: 1.25rem; }
            
            .button-group {
                flex-direction: row;
            }
            .btn { flex: 1; }
        }

        /* Small Mobile Adjustments */
        @media (max-width: 400px) {
            .brand-name { font-size: 2.8rem; }
            .brain-icon img { width: 110px; height: 110px; }
            .description { font-size: 1rem; }
        }

        /* Floating background decoration */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent);
            filter: blur(100px);
            opacity: 0.1;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="bg-circle" style="width: 300px; height: 300px; top: -100px; left: -100px;"></div>
    <div class="bg-circle" style="width: 400px; height: 400px; bottom: -150px; right: -150px;"></div>

    <div class="container">
        <main class="content">
            <div class="logo-container">
                <div class="brain-icon">
                    <img src="./asset/imgages/IMG_20260215_190534-removebg-preview.png" alt="BrainFeed Logo">
                </div>
            </div>

            <h1 class="brand-name">BrainFeed</h1>
            <p class="tagline">Scroll Smart. Learn Daily.</p>

            <p class="description">
                Transform your idle scrolling time into meaningful daily progress.
            </p>

            <div class="button-group">
                <a href="Pages/LoginPG.html?mode=register" class="btn btn-primary">
                    Get Started
                    <i data-lucide="arrow-right" width="18"></i>
                </a>

                <a href="Pages/LoginPG.html?mode=login" class="btn btn-secondary">
                    Sign In
                </a>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
